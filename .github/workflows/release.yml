name: Build & Release Firmware

on:
    push:
        tags:
            - "v*" # Trigger on git tag like v0.1.0

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # full history and tags, to list the changes since the previous release

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.10"

            - name: Install PlatformIO
              run: pip install platformio

            - name: Install esptool
              run: pip install esptool

            - name: Build firmware
              run: ./build-release.sh

            - name: Get version
              id: version
              run: echo "VERSION=$(cat version.txt)" >> $GITHUB_OUTPUT

            - name: Get firmware filename
              id: firmware
              run: |
                  FIRMWARE=$(ls releases/esp8266-fermwatch-v*.bin | head -1)
                  echo "PATH=$FIRMWARE" >> $GITHUB_OUTPUT
                  echo "NAME=$(basename $FIRMWARE)" >> $GITHUB_OUTPUT

            - name: Generate release notes
              run: |
                  PREV=$(git describe --tags --abbrev=0 --match 'v*' "${{ github.ref_name }}^" 2>/dev/null || true)
                  RANGE=${PREV:+$PREV..}${{ github.ref_name }}
                  CHANGES=$(git log --no-merges --pretty='- %s' "$RANGE" | grep -v '^- Bump version' || true)
                  {
                    echo "## FermWatch - Firmware ${{ steps.version.outputs.VERSION }}"
                    echo
                    echo "### Changes"
                    echo "${CHANGES:-- Maintenance release}"
                    if [ -n "$PREV" ]; then
                      echo
                      echo "Full changelog: https://github.com/${{ github.repository }}/compare/$PREV...${{ github.ref_name }}"
                    fi
                    echo
                    cat .github/release-notes-footer.md
                  } > release-notes.md
                  sed -i "s/@FIRMWARE@/${{ steps.firmware.outputs.NAME }}/g; s#@REPO@#${{ github.repository }}#g" release-notes.md

            - name: Create GitHub Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  gh release create ${{ github.ref_name }} \
                    --title "Release ${{ steps.version.outputs.VERSION }}" \
                    --notes-file release-notes.md \
                    "${{ steps.firmware.outputs.PATH }}"
