blueprint:
  name: FermWatch - Send a fermentation sensor to the display
  description: >-
    Publishes the specific gravity, temperature and 24 h trend of one
    fermentation sensor (Tilt, RAPT Pill, ...) to the FermWatch ESP8266 display
    over MQTT, as one retained JSON message. Optionally removes the sensor from
    the display when its gravity entity stays unavailable. Create one
    automation per sensor.


    Values must be in °C and SG, whatever the display units.
  domain: automation
  source_url: https://github.com/normcyr/FermWatch/blob/main/homeassistant/blueprints/fermwatch_sensor.yaml
  min_version: 2024.10.0
  input:
    sensor_name:
      name: Sensor name
      description: Name shown on the display (max 23 characters).
      selector:
        text:
    topic:
      name: MQTT topic
      description: >-
        Unique per sensor, and directly under the device topic base
        (default `fermwatch/<anything>`), for example `fermwatch/tilt_yellow`.
      default: fermwatch/my_sensor
      selector:
        text:
    sg_entity:
      name: Specific gravity entity
      selector:
        entity:
          domain: sensor
    temperature_entity:
      name: Temperature entity (optional, °C)
      description: Select at most one entity.
      default: []
      selector:
        entity:
          domain: sensor
          multiple: true
    trend_entity:
      name: 24 h trend entity (optional)
      description: >-
        For example a Statistics helper with the `change` characteristic over
        24 h. Select at most one entity.
      default: []
      selector:
        entity:
          domain: sensor
          multiple: true
    clear_when_silent:
      name: Remove the sensor from the display when silent
      description: >-
        Sends an empty retained message when the gravity entity stays
        `unavailable` or `unknown`, or reports nothing, for the delay below.
      default: true
      selector:
        boolean:
    silent_delay:
      name: Silent delay
      default:
        hours: 1
        minutes: 0
        seconds: 0
      selector:
        duration:

mode: queued

variables:
  sensor_name: !input sensor_name
  topic: !input topic
  temperature_entity: !input temperature_entity
  trend_entity: !input trend_entity
  clear_when_silent: !input clear_when_silent
  sg_entity: !input sg_entity

# Trigger templates cannot read the blueprint variables above, only these.
trigger_variables:
  sg_entity: !input sg_entity
  silent_delay: !input silent_delay

triggers:
  - trigger: state
    id: update
    entity_id: !input sg_entity
  - trigger: state
    id: update
    entity_id: !input temperature_entity
  - trigger: state
    id: update
    entity_id: !input trend_entity
  - trigger: state
    id: silent
    entity_id: !input sg_entity
    to:
      - unavailable
      - unknown
    for: !input silent_delay
  # Catches an entity that keeps its last value but stopped reporting (dead battery).
  - trigger: template
    id: silent
    value_template: >-
      {% set s = states[sg_entity] %}
      {% set d = (silent_delay.hours | default(0) | int) * 3600
         + (silent_delay.minutes | default(0) | int) * 60
         + (silent_delay.seconds | default(0) | int) %}
      {{ s is not none and (now() - s.last_reported).total_seconds() > d }}

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: silent
        sequence:
          - if:
              - condition: template
                value_template: "{{ clear_when_silent }}"
            then:
              - action: mqtt.publish
                data:
                  topic: "{{ topic }}"
                  retain: true
                  payload: ""
    default:
      - action: mqtt.publish
        data:
          topic: "{{ topic }}"
          retain: true
          payload: >-
            {% set p = {'sensor': sensor_name, 'sg': states(sg_entity)} %}
            {% if temperature_entity %}
              {% set p = dict(p, temperature=states(temperature_entity | first)) %}
            {% endif %}
            {% if trend_entity %}
              {% set p = dict(p, trend=states(trend_entity | first)) %}
            {% endif %}
            {{ p | to_json }}
