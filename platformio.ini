[env:esp8266]
platform = espressif8266 @ ^4.2.0
board = d1_mini
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld

lib_deps =
    PubSubClient @ ^2.8.0
    MD_MAX72XX @ ^3.4.1
    MD_Parola @ ^3.5.2
    ArduinoJson @ ^7.0.0

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
